server {
    listen 80;
    listen [::]:80;
    server_name sensors.la-7.eu;

    # Temporary: root nav page doesn't exist yet, send visitors to the
    # first (and currently only) sensor project.
    location = / {
        return 302 /watertank;
    }

    location /watertank {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
